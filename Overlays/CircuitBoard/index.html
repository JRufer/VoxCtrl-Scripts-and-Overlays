<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="cyber-modal">
    <!-- Shimmering Complex Circuit Board Layer -->
    <svg class="circuit-canvas" viewBox="0 0 540 320" preserveAspectRatio="none">
      <defs>
        <!-- Silver Shimmer Gradient for Circuit Lines -->
        <linearGradient id="circuitShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#5a6f80" stop-opacity="0.32" />
          <stop offset="42%" stop-color="#5a6f80" stop-opacity="0.32" />
          <stop offset="50%" stop-color="#e8f6ff" stop-opacity="0.95" />
          <stop offset="58%" stop-color="#5a6f80" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#5a6f80" stop-opacity="0.32" />
        </linearGradient>
      </defs>

      <g stroke="url(#circuitShimmer)" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Top Left Corner Tracks -->
        <path d="M 12,20 H 90 L 110,40 H 160" />
        <path d="M 12,28 H 86 L 106,48 H 155" />
        <path d="M 12,36 H 82 L 102,56 H 150" />
        <path d="M 12,44 H 78 L 98,64 H 145" />
        <path d="M 12,52 H 74 L 94,72 H 140" />
        <path d="M 35,10 V 20 M 55,10 V 20 M 75,10 V 20" />
        <circle cx="160" cy="40" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="155" cy="48" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="150" cy="56" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="145" cy="64" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="140" cy="72" r="2.2" fill="url(#circuitShimmer)" />

        <!-- Top Right Multi-Pin IC Chip Array -->
        <rect x="382" y="22" width="48" height="28" rx="3" stroke-width="1.4" fill="#2d373f" />
        <g stroke-width="1">
          <line x1="390" y1="14" x2="390" y2="22" />
          <line x1="398" y1="14" x2="398" y2="22" />
          <line x1="406" y1="14" x2="406" y2="22" />
          <line x1="414" y1="14" x2="414" y2="22" />
          <line x1="422" y1="14" x2="422" y2="22" />
          <line x1="390" y1="50" x2="390" y2="58" />
          <line x1="398" y1="50" x2="398" y2="58" />
          <line x1="406" y1="50" x2="406" y2="58" />
          <line x1="414" y1="50" x2="414" y2="58" />
          <line x1="422" y1="50" x2="422" y2="58" />
        </g>
        <path d="M 382,30 H 345 L 330,45 H 290" />
        <path d="M 382,36 H 350 L 335,51 H 270" />
        <path d="M 382,42 H 355 L 340,57 H 255" />
        <path d="M 430,30 H 455 L 475,50 V 90" />
        <path d="M 430,36 H 460 L 485,61 V 98" />
        <path d="M 430,42 H 465 L 495,72 V 106" />
        <circle cx="290" cy="45" r="2" fill="url(#circuitShimmer)" />
        <circle cx="270" cy="51" r="2" fill="url(#circuitShimmer)" />
        <circle cx="255" cy="57" r="2" fill="url(#circuitShimmer)" />
        <circle cx="475" cy="90" r="2" fill="url(#circuitShimmer)" />
        <circle cx="485" cy="98" r="2" fill="url(#circuitShimmer)" />
        <circle cx="495" cy="106" r="2" fill="url(#circuitShimmer)" />

        <!-- Top Right Test Point Matrices -->
        <circle cx="462" cy="20" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="476" cy="20" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="490" cy="20" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="462" cy="30" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="476" cy="30" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="490" cy="30" r="2.2" fill="url(#circuitShimmer)" />

        <!-- Far Left Lateral Conduit Highway -->
        <rect x="14" y="118" width="22" height="60" rx="2" stroke-width="1.3" fill="#2d373f" />
        <path d="M 36,128 H 68 L 88,108 V 82" />
        <path d="M 36,136 H 74 L 96,114 V 86" />
        <path d="M 36,144 H 80 L 104,120 V 90" />
        <path d="M 36,152 H 86 L 112,126 V 94" />
        <path d="M 36,160 H 92 L 120,132 V 98" />
        <path d="M 36,168 H 98 L 128,138 V 102" />
        <circle cx="88" cy="82" r="2" fill="url(#circuitShimmer)" />
        <circle cx="96" cy="86" r="2" fill="url(#circuitShimmer)" />
        <circle cx="104" cy="90" r="2" fill="url(#circuitShimmer)" />
        <circle cx="112" cy="94" r="2" fill="url(#circuitShimmer)" />
        <circle cx="120" cy="98" r="2" fill="url(#circuitShimmer)" />
        <circle cx="128" cy="102" r="2" fill="url(#circuitShimmer)" />

        <!-- Far Right Vertical Multi-Bus Highway -->
        <path d="M 505,120 V 215 L 485,235 H 440" />
        <path d="M 513,110 V 222 L 493,242 H 430" />
        <path d="M 521,100 V 229 L 501,249 H 420" />
        <path d="M 529,90  V 236 L 509,256 H 410" />
        <circle cx="440" cy="235" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="430" cy="242" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="420" cy="249" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="410" cy="256" r="2.2" fill="url(#circuitShimmer)" />

        <!-- Bottom Left IC & Traces -->
        <rect x="42" y="238" width="40" height="26" rx="3" stroke-width="1.3" fill="#2d373f" />
        <line x1="52" y1="230" x2="52" y2="238" />
        <line x1="62" y1="230" x2="62" y2="238" />
        <line x1="72" y1="230" x2="72" y2="238" />
        <path d="M 42,251 H 22 L 10,263 V 305" />
        <path d="M 82,246 H 130 L 150,266 H 200" />
        <path d="M 82,254 H 125 L 145,274 H 190" />
        <path d="M 82,260 H 120 L 140,280 H 180" />
        <circle cx="10" cy="305" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="200" cy="266" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="190" cy="274" r="2.2" fill="url(#circuitShimmer)" />
        <circle cx="180" cy="280" r="2.2" fill="url(#circuitShimmer)" />

        <!-- Bottom Power Conduits -->
        <path d="M 225,320 V 292 L 245,272 H 345 L 365,292 V 320" />
        <path d="M 235,320 V 296 L 251,280 H 339 L 355,296 V 320" />
        <path d="M 245,320 V 300 L 257,288 H 333 L 345,300 V 320" />
        <rect x="286" y="266" width="22" height="13" rx="2" stroke-width="1.1" fill="#2d373f" />
        <circle cx="297" cy="272" r="1.5" fill="url(#circuitShimmer)" />
      </g>
    </svg>

    <!-- Header Section -->
    <div class="modal-header">
      <div class="title">TARGET &gt; {{target}}</div>
      <div class="subtitle-wrapper">
        <span class="status-label status-recording">(Hold to Talk)</span>
        <span class="status-label status-processing">Processing...</span>
        <span class="status-label status-ready">Ready</span>
      </div>
    </div>

    <!-- Inner Waveform Clipping Window -->
    <div class="waveform-panel">
      <svg class="waveform-svg" viewBox="0 0 380 120">
        <defs>
          <!-- Dynamic Multi-Stop Gradient with Fluid Animated Sweep -->
          <linearGradient id="waveGradient" x1="0%" y1="0%" x2="200%" y2="0%">
            <stop offset="0%" stop-color="#a44bf2" />
            <stop offset="25%" stop-color="#559fed" />
            <stop offset="50%" stop-color="#2de3e1" />
            <stop offset="75%" stop-color="#a44bf2" />
            <stop offset="100%" stop-color="#2de3e1" />
          </linearGradient>
        </defs>

        <g fill="url(#waveGradient)">
          <!-- Left Wing Bars with Staggered Variation Offsets -->
          <rect class="w-bar" style="--d: 0.12s;" x="25"  y="57" width="3.2" height="6"   rx="1.6" />
          <rect class="w-bar" style="--d: 0.44s;" x="34"  y="55" width="3.2" height="10"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.81s;" x="43"  y="52" width="3.2" height="16"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.23s;" x="52"  y="47" width="3.2" height="26"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.65s;" x="61"  y="41" width="3.2" height="38"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.38s;" x="70"  y="31" width="3.2" height="58"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.92s;" x="79"  y="43" width="3.2" height="34"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.19s;" x="88"  y="23" width="3.2" height="74"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.53s;" x="97"  y="40" width="3.2" height="40"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.84s;" x="106" y="47" width="3.2" height="26"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.31s;" x="115" y="27" width="3.2" height="66"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.77s;" x="124" y="46" width="3.2" height="28"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.15s;" x="133" y="37" width="3.2" height="46"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.62s;" x="142" y="41" width="3.2" height="38"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.49s;" x="151" y="31" width="3.2" height="58"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.95s;" x="160" y="48" width="3.2" height="24"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.28s;" x="169" y="36" width="3.2" height="48"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.73s;" x="178" y="44" width="3.2" height="32"  rx="1.6" />

          <!-- Center Spikes -->
          <rect class="w-bar" style="--d: 0.05s;" x="187" y="16" width="3.4" height="88"  rx="1.7" />
          <rect class="w-bar" style="--d: 0.42s;" x="196" y="38" width="3.2" height="44"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.88s;" x="205" y="47" width="3.2" height="26"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.35s;" x="214" y="51" width="3.2" height="18"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.68s;" x="223" y="24" width="3.2" height="72"  rx="1.6" />

          <!-- Right Wing Bars -->
          <rect class="w-bar" style="--d: 0.16s;" x="232" y="43" width="3.2" height="34"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.57s;" x="241" y="33" width="3.2" height="54"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.90s;" x="250" y="47" width="3.2" height="26"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.22s;" x="259" y="31" width="3.2" height="58"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.64s;" x="268" y="40" width="3.2" height="40"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.39s;" x="277" y="34" width="3.2" height="52"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.82s;" x="286" y="44" width="3.2" height="32"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.11s;" x="295" y="48" width="3.2" height="24"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.58s;" x="304" y="52" width="3.2" height="16"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.79s;" x="313" y="38" width="3.2" height="44"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.26s;" x="322" y="45" width="3.2" height="30"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.69s;" x="331" y="49" width="3.2" height="22"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.41s;" x="340" y="54" width="3.2" height="12"  rx="1.6" />
          <rect class="w-bar" style="--d: 0.85s;" x="349" y="57" width="3.2" height="6"   rx="1.6" />
        </g>
      </svg>
    </div>
  </div>

</body>
</html>
